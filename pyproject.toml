[project]
name = "callscape"
version = "0.1.0"
description = "Generates a navigable, local HTML call graph of a repo (Python/JS/Go via tree-sitter) with click-through to function bodies and struct definitions. Fills the gap between IDE 'find references' and heavyweight code-intelligence platforms."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["callscape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
